<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820">
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:18px;font-weight:bold}.synthetic-title{font-size:17px;font-weight:bold;fill:#a12222}.subtitle{font-size:14px}.warning{font-size:16px;font-weight:bold;fill:#a12222}.tick,.note{font-size:12px}.axis{stroke:#9aa4b2;stroke-width:1}.card{fill:#f4f7fb;stroke:#9aa4b2;stroke-width:1}.card-title{font-size:18px;font-weight:bold}.card-value{font-size:15px}</style>
<text x="90" y="28" class="synthetic-title">SYNTHETIC PRICE DATA - pipeline demo, not market prices</text>
<text x="90" y="52" class="subtitle">Daily electricity price and weather (UTC)</text>
<text x="90" y="72" class="note">Coverage: 4 price intervals; 24 temperature and 24 wind observations</text>
<text x="90" y="105" class="warning">Insufficient data for a trend (1 day)</text>
<rect x="90.0" y="130" width="840.0" height="250" rx="8" class="card"/>
<text x="108.0" y="162" class="card-title">2026-01-01 UTC</text>
<text x="108.0" y="206" class="card-value">Price: 20.12 EUR/MWH (4 observations)</text>
<text x="108.0" y="254" class="card-value">Temperature: 1.20 °C (24 observations)</text>
<text x="108.0" y="302" class="card-value">Wind: 1.07 m/s (24 observations)</text>
<text x="90" y="780" class="warning">NOTE: SYNTHETIC PRICE DATA - pipeline demo, not market prices</text>
<text x="90" y="805" class="tick">Weather data by Open-Meteo.com (CC BY 4.0). Daily averages are descriptive.</text>
</svg>