[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-data-platform"
version = "0.1.0"
description = "Local energy prices and weather data engineering portfolio project"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pre-commit>=4.0", "pytest>=8.0", "ruff>=0.17.3"]

[project.scripts]
energy-ingest = "energy_platform.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
